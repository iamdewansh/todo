<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>login</title>
	</head>
	<body>
		<button type="button" onclick="login()">Login</button>
		<button type="button" onclick="signup()">signup</button>
		<button type="button" onclick="logout()">Logout</button>
		<button type="button" onclick="forgotPassword()">forgotPassword</button>
		<a href="reset-password.html">reset</a>
		<button
			type="button"
			onclick="window.location.href = `http://localhost:4000/auth/google`"
		>
			Login With Google
		</button>
		<script>
			async function forgotPassword() {
				const res = await fetch('http://localhost:4000/forgotPassword', {
					method: 'POST',
					credentials: 'include',
					headers: { 'content-Type': 'application/json' },
					body: JSON.stringify({ email: 'dewansh1503@gmail.com' }),
				});
				console.log(await res.json());
			}
			
			async function signup() {
				const email = 'dewansh1513@gmail.com';
				const password = 'devpass';
				const res = await fetch('http://localhost:4000/signup', {
					method: 'POST',
					credentials: 'include',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email, password }),
				});
				if (res.ok) {
					const data = await res.json();
					console.log(data);
				} else {
					console.log('Some error occurred while signup');
				}
			}
			async function login() {
				const email = 'dewansh1513@gmail.com';
				const password = 'devpass';
				const res = await fetch('http://localhost:4000/login', {
					method: 'POST',
					credentials: 'include',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email, password }),
				});
				if (res.ok) {
					const data = await res.json();
					console.log(data);
				} else {
					console.log('Cannot login');
					const data = await res.json();
					console.log(data);
				}
			}
			async function logout() {
				const response = await fetch(`http://localhost:4000/logout`, {
					method: 'POST',
					credentials: 'include',
					headers: {
						'Content-Type': 'application/json',
					},
					// body: JSON.stringify({ access_token: ac }),
				});
				if (response.ok) {
					console.log(await response.json());
				} else {
					console.log('Unable to logout');
					console.log(await response.json());
				}
			}
		</script>
	</body>
</html>
